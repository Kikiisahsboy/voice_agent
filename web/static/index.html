<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent</title>
<style>
:root {
  --bg: #f5f5f7;
  --text: #1d1d1f;
  --sub: #86868b;
  --blue: #0071e3;
  --bubble-user: #0071e3;
  --bubble-ai: #e8e8ed;
  --border: rgba(0,0,0,0.06);
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.06);
  --radius: 20px;
  --radius-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  --orange: #f5a623;
  --green: #34c759;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-font-smoothing: antialiased;
}
.app {
  width: 100%; max-width: 480px; height: 100vh; max-height: 860px;
  display: flex; flex-direction: column;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  overflow: hidden;
}
@media (min-width: 500px) {
  .app { border-radius: 32px; margin: 16px; height: calc(100vh - 32px); }
}

/* Header */
.header {
  padding: 16px 20px 8px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.header .dots { display:flex; gap:6px; }
.header .dot { width:10px; height:10px; border-radius:50%; }
.header .dot.red { background:#ff5f57; }
.header .dot.yellow { background:#febc2e; }
.header .dot.green { background:#28c840; }
.header .title { flex:1; text-align:center; font-size:15px; font-weight:600; }

/* Status bar */
.status-bar {
  display:flex; align-items:center; gap:6px;
  padding: 6px 20px; font-size:12px; color:var(--sub);
  min-height: 28px;
}
.status-bar .indicator { width:6px; height:6px; border-radius:50%; }
.status-bar .indicator.active { background:var(--green); animation:pulse 1.5s infinite; }
.status-bar .indicator.idle { background:var(--sub); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Messages */
.messages {
  flex:1; overflow-y:auto; padding: 16px;
  display:flex; flex-direction:column; gap:8px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width:0; }
.msg {
  max-width: 85%; padding: 10px 15px; border-radius:var(--radius-sm);
  font-size:15px; line-height:1.45; word-break:break-word;
  animation: fadeUp 0.3s ease-out;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.msg.user { align-self:flex-end; background:var(--bubble-user); color:#fff; border-bottom-right-radius:4px; }
.msg.ai { align-self:flex-start; background:var(--bubble-ai); color:var(--text); border-bottom-left-radius:4px; }
.msg.ai.streaming::after { content:'|'; animation:blink 0.8s infinite; font-weight:100; color:var(--blue); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.msg.tool {
  align-self:center; max-width:92%;
  background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.2);
  border-radius:10px; font-size:13px; padding:10px 14px;
}
.msg.tool .tool-name { font-weight:600; color:var(--orange); margin-bottom:4px; }
.msg.tool .tool-detail { color:var(--sub); font-size:12px; }
.msg.tool .tool-result { margin-top:6px; color:var(--text); }
.msg.asr-partial { align-self:flex-start; color:var(--sub); font-size:13px; font-style:italic; }

/* Input area */
.input-area {
  padding: 12px 16px 20px;
  display:flex; gap:10px; align-items:flex-end;
  border-top: 1px solid var(--border);
}
.input-area textarea {
  flex:1; border:none; outline:none; resize:none;
  padding:10px 14px; border-radius:20px;
  font-size:15px; font-family:var(--font);
  background:rgba(0,0,0,0.04); color:var(--text);
  max-height:80px; min-height:40px; line-height:1.4;
}
.btn {
  border:none; outline:none; cursor:pointer;
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.15s;
}
.btn.send { background:var(--blue); color:#fff; }
.btn.send:active { transform:scale(0.92); }
.btn.send:disabled { background:var(--sub); cursor:default; }
.btn.voice { background:var(--green); color:#fff; }
.btn.voice.recording { background:#ff3b30; animation:pulse 1s infinite; }
.btn.voice:active { transform:scale(0.92); }
.btn.stop { background:#ff3b30; color:#fff; margin-left:4px; }
.input-row { display:flex; gap:8px; }

/* Responsive tweaks */
@media (max-width: 400px) {
  .msg { max-width:90%; font-size:14px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title">Voice Agent</div>
    <button class="btn stop" id="btnStop" style="display:none;width:28px;height:28px;font-size:14px;" title="停止">
      &#x23F9;
    </button>
  </div>
  <div class="status-bar" id="statusBar">
    <span class="indicator idle"></span>
    <span id="statusText">就绪</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <button class="btn voice" id="btnVoice" title="语音输入">&#x1F399;</button>
    <textarea id="textInput" rows="1" placeholder="输入消息...（Enter 发送）"></textarea>
    <button class="btn send" id="btnSend" title="发送">&#x2191;</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DOM refs
// ═══════════════════════════════════════════════════════
const $messages = document.getElementById('messages');
const $textInput = document.getElementById('textInput');
const $btnSend = document.getElementById('btnSend');
const $btnVoice = document.getElementById('btnVoice');
const $btnStop = document.getElementById('btnStop');
const $statusBar = document.getElementById('statusBar');
const $statusText = document.getElementById('statusText');
const $indicator = $statusBar.querySelector('.indicator');

let isProcessing = false;
let currentAiBubble = null;
let currentPartialBubble = null;
let abortController = null;

// ═══════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════
function setStatus(status, text) {
  $indicator.className = 'indicator ' + (status === 'idle' ? 'idle' : 'active');
  $statusText.textContent = text || status;
}

function scrollBottom() {
  $messages.scrollTop = $messages.scrollHeight;
}

function addMessage(role, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (cls ? ' ' + cls : '');
  div.textContent = text;
  $messages.appendChild(div);
  scrollBottom();
  return div;
}

function addToolCard(name, args, result) {
  const div = document.createElement('div');
  div.className = 'msg tool';
  div.innerHTML = '<div class="tool-name">&#x1F527; ' + escapeHtml(name) + '</div>'
    + '<div class="tool-detail">参数: ' + escapeHtml(JSON.stringify(args)) + '</div>'
    + (result !== undefined ? '<div class="tool-result">结果: ' + escapeHtml(String(result)) + '</div>' : '...');
  $messages.appendChild(div);
  scrollBottom();
  return div;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setProcessing(v) {
  isProcessing = v;
  $btnSend.disabled = v;
  $btnVoice.disabled = v;
  $btnStop.style.display = v ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════════════
//  Text chat
// ═══════════════════════════════════════════════════════
async function sendText() {
  const text = $textInput.value.trim();
  if (!text || isProcessing) return;
  $textInput.value = '';

  addMessage('user', text);
  setProcessing(true);
  setStatus('thinking', '思考中...');

  currentAiBubble = null;
  currentPartialBubble = null;

  abortController = new AbortController();

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: abortController.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const event = JSON.parse(line);
          handleEvent(event);
        } catch (e) {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      addMessage('ai', '抱歉，服务暂时不可用。');
    }
  }

  setProcessing(false);
  setStatus('idle', '就绪');
}

function handleEvent(event) {
  switch (event.type) {
    case 'status':
      setStatus('thinking', event.content);
      break;
    case 'llm_chunk':
    case 'text_chunk':
      if (!currentAiBubble) {
        currentAiBubble = addMessage('ai', '', 'streaming');
      }
      currentAiBubble.textContent += event.content;
      scrollBottom();
      break;
    case 'sentence':
      // sentence is already covered by text_chunk accumulation
      break;
    case 'tool_call':
      addToolCard(event.name, event.args, undefined);
      break;
    case 'tool_result':
      // update the last tool card with result
      const cards = $messages.querySelectorAll('.msg.tool');
      if (cards.length > 0) {
        const last = cards[cards.length - 1];
        const resDiv = last.querySelector('.tool-result');
        if (resDiv) resDiv.textContent = '结果: ' + escapeHtml(String(event.result));
        else {
          const d = document.createElement('div');
          d.className = 'tool-result';
          d.textContent = '结果: ' + escapeHtml(String(event.result));
          last.appendChild(d);
        }
      }
      break;
    case 'asr_partial':
      if (!currentPartialBubble) {
        currentPartialBubble = addMessage('asr-partial', '', 'asr-partial');
      }
      currentPartialBubble.textContent = '识别中: ' + event.content;
      break;
    case 'asr_final':
      if (currentPartialBubble) {
        currentPartialBubble.remove();
        currentPartialBubble = null;
      }
      addMessage('user', event.content);
      break;
    case 'done':
      if (currentAiBubble) {
        currentAiBubble.classList.remove('streaming');
        currentAiBubble = null;
      }
      break;
    case 'error':
      if (currentAiBubble) {
        currentAiBubble.classList.remove('streaming');
        currentAiBubble = null;
      }
      addMessage('ai', event.content || '发生错误，请重试。');
      break;
  }
}

// ═══════════════════════════════════════════════════════
//  Voice recording — AudioContext → PCM → WAV
// ═══════════════════════════════════════════════════════
let audioCtx = null;
let pcmChunks = [];
let scriptNode = null;
let micStream = null;
let isRecording = false;

function encodeWav(samples, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataLength = samples.length * blockAlign;
  const buffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataLength, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
    micStream = stream;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = audioCtx.createMediaStreamSource(stream);
    scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
    pcmChunks = [];

    scriptNode.onaudioprocess = (e) => {
      if (!isRecording) return;
      const input = e.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(input));
    };

    source.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);
    isRecording = true;
  } catch(e) {
    alert('无法访问麦克风: ' + e.message);
  }
}

function stopRecording() {
  isRecording = false;

  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }

  if (pcmChunks.length === 0) {
    setStatus('idle', '就绪');
    return;
  }

  // Merge PCM chunks and encode as WAV
  let totalLen = 0;
  pcmChunks.forEach(c => totalLen += c.length);
  const merged = new Float32Array(totalLen);
  let pos = 0;
  pcmChunks.forEach(c => { merged.set(c, pos); pos += c.length; });

  const wavBlob = encodeWav(merged, 16000);
  processVoiceWav(wavBlob);
}

async function processVoiceWav(wavBlob) {
  setProcessing(true);
  setStatus('processing', '处理中...');

  const formData = new FormData();
  formData.append('audio', wavBlob, 'recording.wav');

  currentAiBubble = null;
  currentPartialBubble = null;
  abortController = new AbortController();

  try {
    const resp = await fetch('/api/chat/voice/stream', {
      method: 'POST',
      body: formData,
      signal: abortController.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const event = JSON.parse(line);
          handleEvent(event);
        } catch (e) {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      addMessage('ai', '抱歉，服务暂时不可用。');
    }
  }

  setProcessing(false);
  setStatus('idle', '就绪');
}

$btnVoice.addEventListener('click', async () => {
  if (isProcessing) return;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('此浏览器不支持麦克风访问。请使用 Chrome 或 Edge。');
    return;
  }

  if (isRecording) {
    stopRecording();
    $btnVoice.classList.remove('recording');
  } else {
    await startRecording();
    $btnVoice.classList.add('recording');
    setStatus('recording', '录音中...');
  }
});

// ═══════════════════════════════════════════════════════
//  Stop button
// ═══════════════════════════════════════════════════════
$btnStop.addEventListener('click', () => {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  if (currentAiBubble) {
    currentAiBubble.classList.remove('streaming');
    currentAiBubble = null;
  }
  setProcessing(false);
  setStatus('idle', '已停止');
});

// ═══════════════════════════════════════════════════════
//  Keyboard
// ═══════════════════════════════════════════════════════
$textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

// ── Init ────────────────────────────────────────────
setStatus('idle', '就绪');
// 检查健康状态
fetch('/api/health').then(r => r.json()).then(h => {
  if (!h.ok) $statusText.textContent = '服务异常';
  console.log('Health:', h);
}).catch(() => {});
</script>
</body>
</html>
