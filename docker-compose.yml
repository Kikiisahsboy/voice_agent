version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: voice-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  agent:
    build: .
    container_name: voice-agent-app
    depends_on:
      - ollama
    ports:
      - "8081:8081"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/voice_agent/chroma_data
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data: